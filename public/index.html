<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purple's To-do list</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>✅ <span>Purple's</span> To-do list</h1>
      <span id="date" class="muted"></span>
    </header>

    <section class="progress-card">
      <div class="progress-info"><strong id="greeting">Hello!</strong><span id="progress-text"></span></div>
      <div class="bar"><div id="bar-fill"></div></div>
    </section>

    <section class="stats">
      <div class="stat"><b id="s-total">0</b><small>Total</small></div>
      <div class="stat"><b id="s-done">0</b><small>Done</small></div>
      <div class="stat"><b id="s-today">0</b><small>Due today</small></div>
      <div class="stat warn"><b id="s-late">0</b><small>Overdue</small></div>
    </section>

    <form id="form" class="form">
      <input id="text" placeholder="✨ Add a new task..." required />
      <div class="row">
        <select id="category"></select>
        <select id="priority">
          <option value="high">🔴 High</option>
          <option value="med" selected>🟡 Medium</option>
          <option value="low">🟢 Low</option>
        </select>
        <input id="due" type="date" />
        <button type="submit">Add</button>
      </div>
    </form>

    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button data-f="all" class="active">All</button>
        <button data-f="active">Active</button>
        <button data-f="completed">Completed</button>
      </div>
      <input id="search" class="search" placeholder="🔍 Search" />
    </div>
    <div class="chips" id="chips"></div>

    <ul id="list" class="list"></ul>

    <footer class="foot">
      <span id="left" class="muted"></span>
      <button id="clear" class="link">Clear completed</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
